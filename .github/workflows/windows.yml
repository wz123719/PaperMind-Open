name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        install: [default, core-only]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install and build from an empty workspace
        run: |
          if ('${{ matrix.install }}' -eq 'core-only') { .\setup.ps1 -CoreOnly }
          else { .\setup.ps1 }
      - name: Verify Docling and PyTorch imports
        if: matrix.install == 'default'
        run: .\.venv\Scripts\python.exe -c "import torch, torchvision; from docling.document_converter import DocumentConverter; print(torch.__version__)"
      - name: Run backend tests
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Verify startup and shutdown
        run: .\start.ps1 -CheckOnly
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: startup-logs-${{ matrix.install }}
          path: storage/runtime-logs/
          if-no-files-found: ignore
